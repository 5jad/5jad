name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#00b4d8&color_dots=#ebedf0,#b3e5f5,#6fcfe8,#2bb5d8,#0090b3
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00e5ff&color_dots=#161b22,#0b3b4a,#0f6a82,#14a3c4,#00e5ff

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
